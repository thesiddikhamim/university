<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>University Research Assistant</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%237C83FF' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><circle cx='11' cy='11' r='8'></circle><line x1='21' y1='21' x2='16.65' y2='16.65'></line></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --accent: #7C83FF;          /* change this one value to recolor the whole page */
      --bg: #0b0b0c;
      --text: #ededee;
      --muted: #77777d;
      --line: #1f1f22;
      --danger: #ff6b6b;
    }

    * { box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 24px;
      -webkit-font-smoothing: antialiased;
    }

    .container { width: 100%; max-width: 560px; }

    h1 {
      font-size: 1.6rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 6px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0 0 36px;
    }

    /* Input: underline only */
    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--line);
      padding-bottom: 12px;
      transition: border-color 0.2s ease;
    }
    .input-wrapper:focus-within { border-color: var(--accent); }
    .input-wrapper.error { border-color: var(--danger); }

    .input-wrapper svg {
      width: 18px;
      height: 18px;
      color: var(--muted);
      flex-shrink: 0;
      transition: color 0.2s ease;
    }
    .input-wrapper:focus-within svg { color: var(--accent); }

    #uniName {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: inherit;
      font-size: 1.1rem;
      padding: 0;
    }
    #uniName::placeholder { color: #4a4a50; }

    .error-msg {
      min-height: 20px;
      margin: 8px 0 0;
      font-size: 0.8rem;
      color: var(--danger);
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .error-msg.show { opacity: 1; }

    /* Action list */
    .group { margin-top: 28px; }
    .group-title {
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      margin: 0 0 4px;
    }

    .action {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 14px 0;
      background: none;
      border: none;
      border-bottom: 1px solid var(--line);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      text-align: left;
      cursor: pointer;
      transition: color 0.2s ease, padding-left 0.2s ease;
    }
    .action svg { width: 17px; height: 17px; stroke-width: 1.5; color: var(--muted); flex-shrink: 0; transition: color 0.2s ease; }
    .action .label { flex: 1; }
    .action .arrow { opacity: 0; transition: opacity 0.2s ease, transform 0.2s ease; transform: translateX(-4px); }

    .action:hover { color: var(--accent); padding-left: 6px; }
    .action:hover svg { color: var(--accent); }
    .action:hover .arrow { opacity: 1; transform: translateX(0); }
    .action:focus-visible { outline: 1px solid var(--accent); outline-offset: 2px; }

    .footer {
      margin-top: 36px;
      font-size: 0.75rem;
      color: #4a4a50;
    }
    .footer kbd {
      font-family: inherit;
      padding: 1px 6px;
      border: 1px solid var(--line);
      border-radius: 5px;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

  <main class="container">
    <h1>Research Assistant</h1>
    <p class="subtitle">Enter a university, then choose what to look up.</p>

    <div class="input-wrapper" id="inputWrapper">
      <i data-lucide="search"></i>
      <input type="text" id="uniName" placeholder="University of Toronto" autocomplete="off" autofocus>
    </div>
    <div class="error-msg" id="errorMsg">Please enter a university name first.</div>

    <section class="group">
      <h2 class="group-title">Admissions</h2>
      <button class="action" data-query="Bangladesh student entry requirements for undergraduates">
        <i data-lucide="file-check"></i><span class="label">Bangladesh Entry Requirements</span><i class="arrow" data-lucide="arrow-up-right"></i>
      </button>
      <button class="action" data-query="tuition fee for bachelors in economics for international students">
        <i data-lucide="banknote"></i><span class="label">Tuition Fee</span><i class="arrow" data-lucide="arrow-up-right"></i>
      </button>
      <button class="action" data-query="scholarships for Bangladeshi or international undergraduate students">
        <i data-lucide="award"></i><span class="label">Scholarships</span><i class="arrow" data-lucide="arrow-up-right"></i>
      </button>
      <button class="action" data-query="English taught courses for undergraduates">
        <i data-lucide="languages"></i><span class="label">English Taught Courses</span><i class="arrow" data-lucide="arrow-up-right"></i>
      </button>
    </section>

    <section class="group">
      <h2 class="group-title">Programmes</h2>
      <button class="action" data-query="Economics courses">
        <i data-lucide="trending-up"></i><span class="label">Economics</span><i class="arrow" data-lucide="arrow-up-right"></i>
      </button>
      <button class="action" data-query="Philosophy Politics Economics">
        <i data-lucide="landmark"></i><span class="label">PPE</span><i class="arrow" data-lucide="arrow-up-right"></i>
      </button>
      <button class="action" data-query="Philosophy courses">
        <i data-lucide="book-open"></i><span class="label">Philosophy</span><i class="arrow" data-lucide="arrow-up-right"></i>
      </button>
    </section>

    <section class="group">
      <h2 class="group-title">Reputation</h2>
      <button class="action" data-query="World ranking">
        <i data-lucide="trophy"></i><span class="label">Ranking</span><i class="arrow" data-lucide="arrow-up-right"></i>
      </button>
    </section>

    <div class="footer">Opens Google in a new tab &middot; <kbd>/</kbd> to focus &middot; <kbd>Enter</kbd> for general admissions</div>
  </main>

  <script>
    lucide.createIcons();

    const input = document.getElementById("uniName");
    const wrapper = document.getElementById("inputWrapper");
    const errorMsg = document.getElementById("errorMsg");

    function search(topic) {
      const uni = input.value.trim();
      if (!uni) {
        wrapper.classList.add("error");
        errorMsg.classList.add("show");
        input.focus();
        return;
      }
      window.open("https://www.google.com/search?q=" + encodeURIComponent(uni + " " + topic), "_blank", "noopener");
    }

    document.querySelectorAll(".action").forEach(btn => {
      btn.addEventListener("click", () => search(btn.dataset.query));
    });

    input.addEventListener("input", () => {
      wrapper.classList.remove("error");
      errorMsg.classList.remove("show");
    });

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") search("undergraduate admissions");
    });

    document.addEventListener("keydown", e => {
      if (e.key === "/" && document.activeElement !== input) {
        e.preventDefault();
        input.focus();
      }
    });
  </script>

</body>
</html>
